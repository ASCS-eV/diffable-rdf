[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffable-rdf"
dynamic = ["version"]
description = "Deterministic, diff-stable serialization for rdflib graphs (RDFC-1.0 + Weisfeiler-Lehman blank-node hashing + idiomatic Turtle)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ASCS e.V." }]
keywords = [
    "rdf",
    "rdflib",
    "turtle",
    "canonicalization",
    "rdfc-1.0",
    "deterministic",
    "diff",
    "serialization",
    "json-ld",
    "pyoxigraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    # rdflib 6.3.2 is the first release where a bare Graph() binds rdflib's
    # curated namespace set: the default for bind_namespaces was "core" (5
    # namespaces) at 6.2.0 and 6.3.0, and became "rdflib" (28+) at 6.3.2.
    # 6.3.2 is also the first release binding https://schema.org/ as "schema"
    # rather than "sdo". well_known_prefix_map() needs both.
    "rdflib>=6.3.2",
    # pyoxigraph 0.5.4 is the first release exposing
    # CanonicalizationAlgorithm.RDFC_1_0; 0.4.0-0.5.3 offer only UNSTABLE.
    # 0.5.0 added the prefixes=/base_iri= arguments to serialize() and
    # RdfFormat.JSON_LD, both also required.
    "pyoxigraph>=0.5.4",
]

[project.urls]
Homepage = "https://github.com/ASCS-eV/diffable-rdf"
Repository = "https://github.com/ASCS-eV/diffable-rdf"
Issues = "https://github.com/ASCS-eV/diffable-rdf/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.version]
path = "src/diffable_rdf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diffable_rdf"]

[tool.hatch.build.targets.sdist]
include = [
    "src/diffable_rdf",
    "tests",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ without requiring an install, so a fresh
# clone can run `pytest` as its first command.
pythonpath = ["src"]

[tool.ruff]
# The longest existing line in src/ is 109 chars and in tests/ is 120, so
# this fits the code as written -- the gate is here to catch new problems,
# not to trigger a repo-wide reformat.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Deliberately conservative. `I` (import sorting) is left out because
# src/diffable_rdf/turtle.py positions imports after module-level statements
# on purpose -- that is what the existing `# noqa: E402` markers document --
# and enabling it would fight that layout. Revisit as its own change.
# `UP` (pyupgrade) is left out because its only finding, UP037, wants to
# unquote the forward-referenced annotations in turtle.py at three sites;
# two are outside this plan's two sanctioned turtle.py edits, and the third
# (isValidList's `l_: "Node"`) is kept quoted on purpose to match rdflib's
# own signature for the method being overridden. Revisit as its own change.
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing unused imports. Fixing them means editing these test files,
# which is out of scope for this plan (no test file changes beyond the new
# tests/conftest.py).
"tests/test_canonicalization_properties.py" = ["F401"]
"tests/test_diffable_rdf.py" = ["F401"]

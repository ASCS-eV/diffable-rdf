[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffable-rdf"
dynamic = ["version"]
description = "Deterministic, diff-stable serialization for rdflib graphs (RDFC-1.0 + Weisfeiler-Lehman blank-node hashing + idiomatic Turtle)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ASCS e.V." }]
keywords = [
    "rdf",
    "rdflib",
    "turtle",
    "canonicalization",
    "rdfc-1.0",
    "deterministic",
    "diff",
    "serialization",
    "json-ld",
    "pyoxigraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    # well_known_prefix_map() needs a bare Graph() to bind rdflib's curated
    # namespace set, with https://schema.org/ bound as "schema"; both hold
    # from rdflib 6.3.2 on.
    "rdflib>=6.3.2",
    # Required pyoxigraph APIs: CanonicalizationAlgorithm.RDFC_1_0, the
    # prefixes=/base_iri= arguments to serialize(), and RdfFormat.JSON_LD.
    "pyoxigraph>=0.5.4",
]

[project.urls]
Homepage = "https://github.com/ASCS-eV/diffable-rdf"
Repository = "https://github.com/ASCS-eV/diffable-rdf"
Issues = "https://github.com/ASCS-eV/diffable-rdf/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.version]
path = "src/diffable_rdf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diffable_rdf"]

[tool.hatch.build.targets.sdist]
include = [
    "src/diffable_rdf",
    "tests",
    "docs/api.md",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src/ without requiring an install, so a fresh
# clone can run `pytest` as its first command.
pythonpath = ["src"]

[tool.ruff]
# Fits the code as written: the gate catches new problems rather than forcing
# a repo-wide reformat.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Deliberately conservative. `I` (import sorting) is left out because
# src/diffable_rdf/turtle.py positions imports after module-level statements
# on purpose -- that is what the `# noqa: E402` markers there document -- and
# enabling it would fight that layout. `UP` (pyupgrade) is left out because
# UP037 wants to unquote the forward-referenced annotations in turtle.py,
# including isValidList's `l_: "Node"`, which stays quoted to match the rdflib
# signature it overrides. Either can be revisited as its own change.
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# These two suites import terms they no longer reference. Clearing the
# imports means editing the test files themselves; until then the rule is
# silenced here rather than repo-wide.
"tests/test_canonicalization_properties.py" = ["F401"]
"tests/test_diffable_rdf.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["src/diffable_rdf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffable-rdf"
dynamic = ["version"]
description = "Deterministic, diff-stable serialization for rdflib graphs (RDFC-1.0 + Weisfeiler-Lehman blank-node hashing + idiomatic Turtle)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ASCS e.V." }]
keywords = [
    "rdf",
    "rdflib",
    "turtle",
    "canonicalization",
    "rdfc-1.0",
    "deterministic",
    "diff",
    "serialization",
    "json-ld",
    "pyoxigraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    # well_known_prefix_map() needs a bare Graph() to bind rdflib's curated
    # namespace set, with https://schema.org/ bound as "schema"; both hold
    # from rdflib 6.3.2 on.
    "rdflib>=6.3.2",
    # Required pyoxigraph APIs: CanonicalizationAlgorithm.RDFC_1_0, the
    # prefixes=/base_iri= arguments to serialize(), and RdfFormat.JSON_LD.
    "pyoxigraph>=0.5.4",
]

[project.urls]
Homepage = "https://github.com/ASCS-eV/diffable-rdf"
Repository = "https://github.com/ASCS-eV/diffable-rdf"
Issues = "https://github.com/ASCS-eV/diffable-rdf/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.version]
path = "src/diffable_rdf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/diffable_rdf"]

[tool.hatch.build.targets.sdist]
include = [
    "scripts",
    "src/diffable_rdf",
    "tests",
    "docs/api.md",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The lint gate enforces the project's selected style rules.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# `I` and `UP` are excluded because the project preserves required import and
# forward-reference layouts in the RDFLib serializer adapter.
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src/diffable_rdf"]

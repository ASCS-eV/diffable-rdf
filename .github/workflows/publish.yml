name: publish

# Publishes to PyPI via a Trusted Publisher (OIDC) when a GitHub Release is
# published. No API token is needed; the `pypi` environment gates the release.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        # Nothing else ties the two together. A release tagged v0.3.0 while
        # __version__ still said 0.2.0 would publish a 0.2.0 distribution --
        # rejected by PyPI if that version exists, and silently wrong if it
        # does not. The changelog is checked too, so a version cannot ship
        # without the entry describing what changed in it.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oP '^__version__ = "\K[^"]+' src/diffable_rdf/__init__.py)"
          echo "tag=$tag package=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag '$GITHUB_REF_NAME' does not match __version__ '$version'" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          fi

      - name: Run tests
        run: |
          # --locked checks the committed metadata before the --frozen run.
          uv sync --locked --group dev
          uv run --frozen pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Check metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publisher (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
